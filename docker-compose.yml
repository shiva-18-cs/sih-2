version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: cmpdi_postgres_pgvector
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: cmpdi_intelligence
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cmpdi_intelligence"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cmpdi_backend_api
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/cmpdi_intelligence
      SECRET_KEY: super-secret-cmpdi-jwt-key-for-hackathon-2026
      STORAGE_DIR: /app/storage/documents
      DATASET_DIR: /app/dataset
    volumes:
      - ./storage:/app/storage
      - ./dataset:/app/dataset
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cmpdi_frontend_web
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
